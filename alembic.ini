# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = migrations
prepend_sys_path = .

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
file_template = %%(rev)s_%%(slug)s

# timezone to use when rendering the date within the migration file as well as the filename.
timezone = UTC

# max length of characters to apply to the "slug" field
truncate_slug_length = 40

# set to 'true' to run the environment during the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without a .py file to be detected
# sourceless = false

# version location specification; This defaults to migrations/versions.
version_locations = migrations/versions

# version path separator; as of Alembic 1.2, this defaults to os.pathsep.
version_path_separator = os

# the output encoding used when revisions are written from script.py.mako
output_encoding = utf-8

# sqlalchemy.url is dynamically overridden by migrations/env.py from environment variables
sqlalchemy.url = postgresql+asyncpg://user:pass@host/dbname

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
